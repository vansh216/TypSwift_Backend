# TypSwift — Docker Compose
#
# DEVELOPMENT ONLY
# Runs Redis locally for development
#
# MongoDB — use local installation
# Redis   — runs in Docker
#
# Someone who forks with no local MongoDB
# can add mongo service back here
#
# Production:
# MongoDB → Atlas
# Redis   → Redis Cloud

version: '3.9'

services:


  # Redis Service only
  redis:
    image: redis:7-alpine
    container_name: typswift-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test        : ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval    : 10s
      timeout     : 5s
      retries     : 5
      start_period: 10s

volumes:
  redis_data:
    driver: local